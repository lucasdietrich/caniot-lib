[package]
name = "caniot"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "debug"]
std = ["dep:rand"]
debug = []

[dependencies]
caniot-sys = { path = "../caniot-sys" }
num = "0.4.3"
num-derive = "0.4.2"
num-traits = "0.2.19"
rand = { version = "0.9.2", optional = true }

[dev-dependencies]
log = "0.4.27"
simple_logger = "5.0.0"
